---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: lewcite-lite

description: "Personal Fedora Atomic image based on Universal Blue, with LabWC, Noctalia and Noctalia Greeter."

base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:

  - from-file: ../modules/20-system/common/system.yml
  - from-file: ../modules/30-apps/common/apps.yml
  - from-file: ../modules/60-shell/labwc/labwc-shell.yml
  - from-file: ../modules/60-shell/common/noctalia.yml
  - from-file: ../modules/60-shell/common/noctaliagreeter.yml
  - from-file: ../modules/60-shell/labwc/noctalia-labwc-connector.yml
  - from-file: ../modules/70-desktop/common/apps.yml
  - from-file: ../modules/70-desktop/mate/mate-apps.yml
  - from-file: ../modules/70-desktop/mate/mate-noctalia-connector.yml
  - from-file: ../modules/80-cleanup/common/apps-clean.yml


  # -----------------------------------------------
  # OS details
  # -----------------------------------------------

  - type: os-release
    properties:
      ID: aspenblue-lewcite
      ID_LIKE: fedora
      NAME: "Aspenblue Lewcite"
      PRETTY_NAME: "Aspenblue Lewcite - Fedora Atomic"
      VERSION: "44"
      VARIANT: "Lite Edition"
      VARIANT_ID: lite
      HOME_URL: "https://github.com/aspenblue/noctaline"


  # -----------------------------------------------
  # Sign image
  # -----------------------------------------------

  - type: signing